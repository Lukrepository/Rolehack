<!doctype html>
<html lang="en" data-skin="terminal" data-case="on" data-phosphor="color">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rolehack</title>
<link rel="stylesheet" href="rolehack.css">
</head>
<body>
<div id="app">
  <div id="case" class="layer"></div>
  <div id="glass">
    <canvas id="map"></canvas>
    <div id="bands">
      <div id="msgband"></div>
      <div id="chips"></div>
      <div id="statband"></div>
    </div>
    <div id="tube"></div>
  </div>
  <div id="keys" class="layer"></div>
</div>
<div id="modal" hidden><div class="box">
  <div class="title" id="modal-title"></div>
  <div class="body" id="modal-body"></div>
  <div class="foot" id="modal-foot"></div>
</div></div>
<div id="formwrap" hidden><div class="box" id="form">
  <div class="title"></div>
  <div class="body"></div>
</div></div>
<div id="kbd"></div>
<div id="boot">Loading Rolehack…</div>
<script type="module" src="web.js"></script>
</body>
</html>
